/**:
  vision_odometry_noise_node:
    ros__parameters:
      vehicle_name: "px4_1"          # matches the /model/<vehicle_name>/odometry ground-truth topic and /<vehicle_name>/fmu/in/... PX4 topics

      # Ablation switch for comparison runs. true (default): realistic sensor emulation --
      # clipped Gaussian noise on position/velocity/orientation, published on a bootstrap-
      # jittered timer (mean ~9.3ms / ~107Hz, see bootstrap_pool_* below). false: publish
      # Gazebo ground truth straight through with zero added noise, on a fixed-rate timer at
      # clean_publish_rate_hz -- the bootstrap_pool_*/*_noise_* params below are all ignored
      # in that mode (the CSV isn't even loaded).
      #
      # NOTE: false does NOT publish synchronously on every ground-truth sample anymore
      # (that was ~250Hz, matching Gazebo's physics step) -- it confounded the ablation, since
      # noise_and_delays_enabled would then be changing BOTH noise magnitude AND publish rate
      # at once, and 250Hz vision fusion turned out to have its own (still not fully
      # understood) effect independent of noise. clean_publish_rate_hz lets rate be held
      # comparable between arms so noise is the only thing actually being isolated.
      noise_and_delays_enabled: true

      # Fixed publish rate used only when noise_and_delays_enabled=false (see note above).
      clean_publish_rate_hz: 125.0

      # Ground-truth source: bridged from the sentinel_vision model's gz-sim-odometry-publisher-system
      # plugin via gz_odom.yaml (nav_msgs/Odometry on /model/<vehicle_name>/odometry).
      ground_truth_topic: ""         # empty = derive as /model/<vehicle_name>/odometry

      # Noise, per sensor_noise_profile.json. Independent zero-mean Gaussian per channel.
      # Matched on the PX4 side too (EKF2_EVP_NOISE/EKF2_EVV_NOISE/EKF2_EVA_NOISE in
      # 4100_gz_sentinel) so PX4 trusts these appropriately.
      position_noise_std_m: 0.01
      velocity_noise_std_mps: 0.02
      orientation_noise_std_rad: 0.01

      # Position/velocity noise is truncated at +/- clip_sigma standard deviations (per axis).
      # Still Gaussian in the bulk -- this only truncates the tails, it doesn't change scale.
      #
      # Sizing this against PX4's actual EKF2 innovation gate, not a guess (verified directly
      # against this branch's src/modules/ekf2/EKF/ev_vel_control.cpp, ev_pos_control.cpp,
      # ekf.h::setEstimatorAidStatusTestRatio, and EKF2.cpp's EKF2_EV_NOISE_MD handling):
      #   test_ratio = innovation^2 / (gate^2 * (P_ii + observation_variance))
      # Because EKF2_EV_NOISE_MD=1, observation_variance is forced to exactly
      # EKF2_EVV_NOISE^2 / EKF2_EVP_NOISE^2 (our published variance fields are ignored). P_ii
      # (the EKF's own velocity/position state covariance) only ever adds margin, so the
      # worst case (P_ii -> 0, tightly converged filter) rejects once
      #   |innovation| > gate * EKF2_EVx_NOISE
      # With this repo's airframe values -- EKF2_EVV_GATE=3.0 (compiled default, unreferenced/
      # unoverridden anywhere in this repo) and EKF2_EVV_NOISE=0.02 -- that boundary is
      # 3.0*0.02 = 0.06 m/s. A 3-sigma clip is 3*0.02 = 0.06 m/s: EXACTLY on that boundary
      # (test_ratio ~= 1.0 already at the clip bound), which is why 3-sigma clipping alone did
      # not stop the "Preflight Fail: velocity estimate error" warning. clip_sigma must stay
      # well under the gate, not at it, to leave margin for filter lag/timing jitter/real
      # dynamics on top of the pure noise draw:
      #   test_ratio_at_clip_bound ~= (clip_sigma / gate)^2
      # velocity_noise_clip_sigma=2.0 -> (2.0/3.0)^2 ~= 0.44 (44% of the reject threshold).
      # position_noise_clip_sigma=2.0 against EKF2_EVP_GATE=5.0, EKF2_EVP_NOISE=0.01 ->
      # (2.0/5.0)^2 ~= 0.16 (position wasn't failing, but tightened to match for consistency).
      position_noise_clip_sigma: 2.0
      velocity_noise_clip_sigma: 2.0

      # Publish timing: NOT a fixed rate. Each inter-publish interval is drawn with replacement
      # from this bootstrap pool of real historical sensor dt values (microseconds). Empty path
      # resolves to the CSV packaged with this node (data/dt_bootstrap_pool_us.csv).
      bootstrap_pool_csv: ""
      bootstrap_pool_rng_seed: 42    # -1 = unseeded (nondeterministic); set >= 0 for reproducible runs
